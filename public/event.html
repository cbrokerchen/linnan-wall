<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動簽到與投票</title>
  <link rel="stylesheet" href="event.css">
</head>
<body>
  <main class="shell">
    <div class="brand">LINNAN EVENT</div>
    <h1 id="pageTitle">活動簽到與投票</h1>
    <p class="lead" id="subtitle">輸入活動代碼與個人代碼完成簽到。</p>

    <section class="card stack" id="joinCard">
      <label>活動代碼<input id="eventId" autocomplete="off" maxlength="48" placeholder="例如 annual-meeting-2026"></label>
      <label>個人代碼<input id="accessCode" autocomplete="one-time-code" maxlength="32" placeholder="請輸入主辦單位提供的代碼"></label>
      <button id="joinBtn">驗證並簽到</button>
    </section>

    <section class="card stack hidden" id="statusCard">
      <div class="toolbar"><strong id="participantName"></strong><span class="pill" id="eventStatus"></span></div>
      <div class="notice ok" id="checkinNotice">已完成簽到</div>
      <div id="waiting" class="notice">主持人尚未開放投票，頁面會自動更新。</div>
      <form id="voteForm" class="hidden">
        <h2 id="electionTitle">投票</h2>
        <div class="choices" id="candidateList"></div>
        <button type="submit" id="voteBtn">確認送出選票</button>
      </form>
      <div id="voted" class="notice ok hidden">你的選票已送出。本系統不保存你選擇的候選人與身分對照。</div>
      <div id="results" class="hidden"><h2>投票結果</h2><div id="resultList"></div></div>
    </section>
    <div id="message" class="notice hidden"></div>
  </main>
  <script type="module" src="event.js"></script>
</body>
</html>
