<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>教會討論牆</title>
<style>
  :root{
    --bg:#f5efe6; --bg-soft:#efe6d8; --card:#fffdf8; --ink:#3a3226;
    --muted:#8a7f6c; --gold:#b08d57; --gold-deep:#8f6d3d; --accent:#2f6b4f;
    --line:#e4d9c4; --shadow:0 2px 10px rgba(60,50,30,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;min-height:100vh}

  /* --- 頂部題目區 --- */
  .header{background:linear-gradient(135deg,#fffdf8,#f2e7d3);border-bottom:1px solid var(--line);padding:18px 22px 16px}
  .wrap{max-width:980px;margin:0 auto}
  .kicker{display:flex;align-items:center;gap:10px;color:var(--gold-deep);font-size:.95rem;letter-spacing:.5px}
  .kicker .dot{width:30px;height:4px;border-radius:2px;background:var(--gold)}
  .qnum{color:var(--gold-deep);font-weight:700}
  .qtitle{font-size:clamp(1.35rem,3.4vw,2.05rem);font-weight:700;line-height:1.45;margin-top:8px;color:var(--ink)}
  .live{display:inline-flex;align-items:center;gap:6px;margin-left:8px;background:var(--accent);color:#eef6f0;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;vertical-align:middle;letter-spacing:1px}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#7fe0ab;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.35}}

  .stage{max-width:1180px;margin:0 auto;padding:22px;display:flex;gap:24px;align-items:flex-start;min-height:60vh}
.feed-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.qr-col{width:230px;flex-shrink:0;background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;position:sticky;top:20px;box-shadow:var(--shadow)}
.qr-col img{width:100%;height:auto;display:block;border-radius:6px}
.qr-col .qr-url{font-size:.82rem;color:var(--muted);margin-top:12px;word-break:break-all;line-height:1.5}
.qr-col .qr-hint{font-size:.72rem;color:var(--gold-deep);font-weight:700;letter-spacing:.5px;margin-bottom:10px}
  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:1.05rem;line-height:1.8}
  .post{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);animation:fade .35s ease}
  .post .t{font-size:1.15rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .post .m{color:var(--muted);font-size:.78rem;margin-top:10px}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .empty-note{font-size:.9rem;margin-top:12px;color:var(--muted)}

  /* --- 主控條(僅投影端) --- */
  .control{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:12px 20px;backdrop-filter:blur(4px);z-index:20}
  .control .wrap{display:flex;align-items:center;gap:10px}
  .ctrl-label{color:var(--muted);font-size:.85rem;white-space:nowrap}
  .tabs{display:flex;gap:8px}
  .tabs button{min-width:54px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fffdf8;color:var(--muted);font-size:.95rem;cursor:pointer;transition:all .15s}
  .tabs button.on{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;font-weight:700}
  #clearBtn{margin-left:auto;padding:8px 16px;border-radius:8px;border:1px solid #d8a99a;background:#fffdf8;color:#a05a43;cursor:pointer;font-size:.85rem}

  /* --- 手機輸入 --- */
  #inputs{max-width:980px;margin:0 auto;padding:16px 22px 90px}
  .ph{color:var(--muted);font-size:.85rem;margin-bottom:10px}
  #inputs textarea{width:100%;padding:16px;border-radius:12px;border:1px solid var(--line);background:#fffdf8;color:var(--ink);font-size:1.15rem;line-height:1.6;resize:none;box-shadow:var(--shadow);min-height:110px}
  #sendBtn{width:100%;padding:18px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;font-size:1.35rem;font-weight:800;cursor:pointer;margin-top:12px;letter-spacing:3px;box-shadow:0 4px 14px rgba(143,109,61,.3)}
  #sendBtn:active{transform:scale(.98)}

  /* --- 錯誤顯示 --- */
  #err{display:none;max-width:980px;margin:14px auto 0;padding:12px 16px;border-radius:10px;background:#f4e2dc;color:#8f3524;font-size:.88rem;white-space:pre-wrap;word-break:break-word}
  #err.show{display:block}

  /* --- toast --- */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--accent);color:#eef6f0;padding:14px 28px;border-radius:999px;font-weight:700;font-size:1.05rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;box-shadow:0 4px 16px rgba(20,60,40,.25)}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <div class="wrap">
    <div class="kicker"><span class="dot"></span> 同工討論 · 第 <span class="qnum" id="qno">1</span> 題<span class="live" id="liveTag">LIVE</span></div>
    <div class="qtitle" id="qText">載入中...</div>
  </div>
</div>

<div class="stage">
  <div class="feed-col"><div id="feed" class="empty">載入中...</div></div>
  <div class="qr-col" id="qrCol">
    <div class="qr-hint">📱 用手機掃描加入討論</div>
    <img src="qr.png" alt="討論牆 QR code">
    <div class="qr-url">linnan-wall.web.app</div>
  </div>
</div>

<div id="inputs" style="display:none">
  <div class="ph">🔒 輸入你的回應後按送出，文字即時顯示在大螢幕</div>
  <textarea id="txt" rows="4" placeholder="請輸入你的回應..."></textarea>
  <button id="sendBtn">送出 ➤</button>
</div>

<div id="err"></div>

<div class="control">
  <div class="wrap">
    <span class="ctrl-label">切換題目</span>
    <div class="tabs" id="tabs"></div>
    <button id="clearBtn">🗑 清空本題</button>
  </div>
</div>

<div class="toast" id="toast">已送出 ✓</div>

<script type="module">
  const QUESTIONS = [
    "你希望我們地方教會除了差傳以外，還有哪些是可以一起合作？",
    "牧會的過程中，你覺得最辛苦的是什麼？",
    "你的教會最需要代禱的是什麼？",
    "你個人需要代禱的是什麼？"
  ];
  const SUB = new URLSearchParams(location.search).get("s") === "1";

  const $ = id => document.getElementById(id);
  const qText = $("qText"), qno = $("qno"), feed = $("feed"), tabs = $("tabs"),
        inputs = $("inputs"), txt = $("txt"), sendBtn = $("sendBtn"),
        clearBtn = $("clearBtn"), liveTag = $("liveTag"), toast = $("toast"),
        errBox = $("err");

  window.__showErr = function(label, e) {
    errBox.classList.add("show");
    errBox.textContent = label + ": " + (e && e.message ? e.message : e);
    console.error(label, e);
  };
  window.addEventListener("error", e => window.__showErr("錯誤", e.message));
  window.addEventListener("unhandledrejection", e => window.__showErr("錯誤(promise)", e.reason && e.reason.message || e.reason));

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, getDoc, getDocs, setDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  let db, activeQ = 1, unsub = null;
  try {
    db = getFirestore(initializeApp({ apiKey: "AIzaSyDhXcMZYOry8s3S3eRHfYkRQ6o9VU8c7dc", projectId: "linnan-de218" }));
  } catch (e) { window.__showErr("Firebase 初始化失敗", e); }

  QUESTIONS.forEach((_, i) => {
    const b = document.createElement("button");
    b.textContent = "Q" + (i + 1);
    b.onclick = () => setActive(i + 1);
    tabs.appendChild(b);
  });

  function cfgRef() { return doc(db, "config", "active"); }
  async function ensureActive() {
    if (!db) return;
    try { const d = await getDoc(cfgRef()); if (!d.exists()) await setDoc(cfgRef(), { q: 1 }); } catch (e) {}
  }

  function setActive(q) {
    activeQ = q;
    const idx = q - 1;
    qno.textContent = q;
    qText.textContent = QUESTIONS[idx] || "？";
    [...tabs.children].forEach((b, i) => b.classList.toggle("on", i === idx));

    if (SUB) {
      inputs.style.display = (q === 4) ? "none" : "block";
      liveTag.style.display = "none";
      document.querySelector(".control").style.display = "flex";     // 手機端保留切題，只藏清空
      clearBtn.style.display = "none";                                // 手機端不給清空
      document.querySelector(".qr-col").style.display = "none";     // 手機端不顯示 QR
      document.querySelector(".stage").style.minHeight = "0";       // 手機端去掉彈性高度
      // 手機端：答案區移到輸入框下方（DOM move）
      inputs.after(document.querySelector(".stage"));
      // 手機端輸入容器窄版
      inputs.style.padding = "14px 22px 0";
    } else {
      inputs.style.display = "none";
      liveTag.style.display = "inline-flex";
      document.querySelector(".control").style.display = "flex";
      clearBtn.style.display = "inline-block";
      document.querySelector(".qr-col").style.display = "block";
    }

    unsub && unsub();
    try {
      const qPosts = query(collection(db, "posts"), where("q", "==", q));
      unsub = onSnapshot(qPosts, snap => {
        const items = [];
        snap.forEach(d => items.push(d.data()));
        items.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        render(items, q);
      }, err => window.__showErr("讀取答案失敗", err));
    } catch (e) { window.__showErr("訂閱失敗", e); }
  }

  function render(items, q) {
    if (q === 4) {
      // 第四題「個人代禱」不需輸入，投影端只顯示引導
      feed.innerHTML = SUB ? ''
        : '<div class="empty">🙏 請各小組輪流分享代禱事項<div class="empty-note">這一題請現場口頭分享</div></div>';
      return;
    }
    if (!items.length) {
      feed.innerHTML = SUB ? '<div class="empty">還沒有回應，等大家輸入…</div>'
        : '<div class="empty">還沒有回應…<div class="empty-note">掃描手機 QR 碼進入，輸入後即時顯示在上方</div></div>';
      return;
    }
    feed.innerHTML = "";
    items.forEach(it => {
      const d = document.createElement("div");
      d.className = "post";
      const now = new Date(it.ts || Date.now());
      d.innerHTML = '<div class="t">' + esc(it.text) + '</div><div class="m">🕐 ' + now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" }) + '</div>';
      feed.appendChild(d);
    });
  }
  function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  try {
    setActive(1);
    onSnapshot(cfgRef(), snap => {
      let q = snap.exists() ? snap.data().q : 1;
      if (!q) q = 1;
      setActive(q);
    }, err => window.__showErr("訂閱題目失敗", err));
    ensureActive();
  } catch (e) { window.__showErr("初始化失敗", e); }

  sendBtn.onclick = async () => {
    try {
      const text = txt.value.trim();
      if (!text) return;
      await addDoc(collection(db, "posts"), { q: activeQ, text: text, ts: Date.now() });
      txt.value = "";
      toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 1500);
    } catch (e) { window.__showErr("送出失敗", e); }
  };
  txt.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });

  clearBtn.onclick = async () => {
    if (!confirm("確定清除第 " + activeQ + " 題所有答案？")) return;
    try {
      const qPosts = query(collection(db, "posts"), where("q", "==", activeQ));
      const snap = await getDocs(qPosts);
      snap.forEach(async d => { await deleteDoc(d.ref); });
    } catch (e) { window.__showErr("清除失敗", e); }
  };
</script>
</body>
</html>
